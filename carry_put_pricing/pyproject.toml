[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carry-put-pricing"
version = "0.1.0"
description = "American put on the CSI 1000 / IM carry curve"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
